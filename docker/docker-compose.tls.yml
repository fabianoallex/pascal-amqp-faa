# Override that ADDS TLS (5671) to the docker-compose.yml service, without changing it.
#
# 1) Generate the self-signed certificates (from the docker/ folder). The `chmod 644`
#    on the key is ESSENTIAL: openssl creates the key as 600/root and RabbitMQ runs
#    as uid 999 — without the chmod the broker aborts with "keyfile ... cannot be read".
#      New-Item -ItemType Directory -Force certs | Out-Null
#      docker run --rm -v "${PWD}/certs:/certs" alpine/openssl req -x509 -newkey rsa:2048 -nodes -keyout /certs/server.key -out /certs/server.crt -days 365 -subj "/CN=localhost"
#      docker run --rm -v "${PWD}/certs:/certs" alpine chmod 644 /certs/server.key
#
# 2) Bring it up combining both files:
#      docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Certs are dev/disposable — do not commit ./certs/.

services:
  rabbitmq:
    ports:
      - "5671:5671"   # AMQP over TLS (amqps)
    volumes:
      - ./certs:/etc/rabbitmq/certs:ro
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
