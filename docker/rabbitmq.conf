# RabbitMQ configuration with a TLS listener (to validate the lib's amqps://).
# Keeps the plain TCP listener (5672) and adds TLS (5671).

listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.certfile = /etc/rabbitmq/certs/server.crt
ssl_options.keyfile  = /etc/rabbitmq/certs/server.key

# Dev: server authentication only (the client does not present a certificate).
# The test client uses TlsVerifyPeer=False (accepts the self-signed cert).
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
