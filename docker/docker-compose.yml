services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: delphi-amqp-faa-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol (what Delphi will use)
      - "15672:15672" # web management panel (http://localhost:15672 - guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
